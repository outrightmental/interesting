name: Make the website more interesting

on:
  schedule:
    - cron: "17 * * * *" # hourly, at 17 minutes past
  workflow_dispatch:
    inputs:
      model:
        description: "GitHub Copilot model ID to use (leave blank to pick one of the heaviest models at random)"
        required: false
        default: ""
      kind:
        description: "Kind of run: grow the site, or consolidate it (auto alternates by run number: odd grows, even consolidates)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - interesting
          - consolidate

permissions: {}

env:
  COPILOT_CLI_VERSION: "1.0.91" # pinned: the silo relies on this version's flags and output format

jobs:
  # Never more than one run at a time: a run that starts while an earlier run of this workflow is
  # still going does nothing. (A workflow-level `concurrency` group would queue the run instead.)
  guard:
    name: Skip if a previous run is still going
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list this workflow's runs
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Look for an earlier run that is still going
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_file="${GITHUB_WORKFLOW_REF%%@*}"
          workflow_file="${workflow_file##*/}"
          api="repos/${GITHUB_REPOSITORY}/actions"
          started_at="$(gh api "${api}/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')"

          # Every run of this workflow that has not finished yet. One listing rather than one per
          # status, so that a run changing status cannot slip between two queries. It covers the
          # newest 100 runs, which is days of history at this cadence.
          unfinished="${RUNNER_TEMP}/unfinished-runs.jsonl"
          gh api "${api}/workflows/${workflow_file}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed")' > "$unfinished"

          # Keep the ones that started before this run. When two runs start in the same second, the
          # lower run id counts as earlier, so exactly one of them proceeds.
          earlier="$(jq -r --arg started "$started_at" --argjson id "$GITHUB_RUN_ID" '
            select(.id != $id)
            | select(.run_started_at < $started or (.run_started_at == $started and .id < $id))
            | "\(.html_url) (\(.status), started \(.run_started_at))"' "$unfinished" | sort -u)"

          if [ -n "$earlier" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: an earlier run of this workflow is still going."
            {
              echo "### Skipped"
              echo "An earlier run of this workflow is still going:"
              printf '%s\n' "$earlier" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  iterate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    # Backstop for the guard: even a race can never run two iterations at once. "Re-run failed
    # jobs" does not repeat the guard, so such a re-run waits its turn here instead of skipping;
    # use "Run workflow" to retry.
    concurrency:
      group: make-interesting
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Room for three attempts at a quarter of an hour each (MODEL_TIMEOUT_SECONDS in the script),
    # plus a build of the site after every answer. A run that outlasts the hour makes the next
    # scheduled run skip itself (the guard above), which is the intended way to wait.
    timeout-minutes: 60
    permissions:
      contents: write # commit changes to /site
      copilot-requests: write # call GitHub Copilot with the workflow's own token
    steps:
      # One Node for everything this job runs: the Copilot CLI below is a global npm install, so it
      # has to be installed with the Node that will later go looking for it on PATH. No cache here,
      # because caching npm needs the lock file and the checkout has not happened yet.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The platform package is the CLI binary itself: an exact version with no dependencies and no
      # install scripts, so nothing unpinned ever runs next to the token. It is installed before
      # checkout, away from the repository's credentials.
      - name: Install GitHub Copilot CLI
        run: |
          npm install --global --ignore-scripts "@github/copilot-linux-x64@${COPILOT_CLI_VERSION}"
          copilot-linux-x64 --version

      # No credentials are left in the checkout: the model's answer is applied here. The model step
      # gets only the Copilot token (the workflow's own token, unless a COPILOT_GITHUB_TOKEN secret
      # is set), and the last step gets the token it pushes with.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The script builds every answer before it accepts it: /site is source, so the reachability
      # axiom is about the built site, and an answer that does not build is refused. node_modules is
      # gitignored, so installing it here cannot look like a change to the repository, and
      # --ignore-scripts keeps npm from running install hooks at all.
      - name: Install the build toolchain
        run: npm ci --ignore-scripts

      # Which kind of run this is -- a growing run or a consolidating run -- follows from the run
      # number: odd grows the site, even consolidates it, unless the manual "kind" input names one.
      # The model is one of the heaviest Copilot offers, at near-maximum reasoning effort.
      - name: Ask one of the heaviest AI models to work on the website
        id: ai
        env:
          # A fine-grained PAT with the "Copilot Requests" permission, if one is configured (billed
          # to that user's Copilot plan). Otherwise the workflow's own token, which Copilot accepts
          # once the organization allows Copilot CLI usage billed to the organization.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          COPILOT_BIN: copilot-linux-x64
          MODEL: ${{ inputs.model }}
          # Optional comma-separated list of model ids to pick from instead of the built-in list.
          # List flagship models only: ids recognised as small or mid-tier are refused, but an
          # unknown id that is only a version number cannot be judged and is used as listed.
          MODEL_POOL: ${{ vars.MODEL_POOL }}
          # Optional override of the reasoning effort every model is asked for (default xhigh, one
          # below max): none, minimal, low, medium, high, xhigh or max.
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_KIND: ${{ inputs.kind }}
        run: python3 .github/scripts/make_interesting.py

      - name: Ensure only /site was modified
        run: |
          outside="$(git status --porcelain --untracked-files=all -- . ':(exclude)site')"
          if [ -n "$outside" ]; then
            echo "::error::Changes outside /site are not allowed:"
            echo "$outside"
            exit 1
          fi
          test -f site/index.html || { echo "::error::site/index.html is missing"; exit 1; }
          test -f site/error.html || { echo "::error::site/error.html is missing"; exit 1; }

      # Nothing here deploys. Once this workflow finishes, the main-branch pipeline in deploy.yml
      # tests the new commit and publishes it.
      - name: Commit and push
        env:
          MODEL: ${{ steps.ai.outputs.model }}
          SUMMARY: ${{ steps.ai.outputs.summary }}
          # "Make the website more interesting" on a growing run, "Consolidate the website" on a
          # consolidating one: the script names the kind, so the commit log shows which was which.
          HEADLINE: ${{ steps.ai.outputs.headline }}
          KIND: ${{ steps.ai.outputs.kind }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -A -- site
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${HEADLINE}: ${SUMMARY}" -m "Model: ${MODEL}" -m "Run: ${KIND}"
          # The branch may have moved while the model was thinking: rebase the commit and try again.
          # The token is given to this one command; it was never written into the checkout.
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pushed=false
          for attempt in 1 2 3; do
            if git push "$remote" "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "::notice::Push ${attempt} was rejected; rebasing onto the latest ${GITHUB_REF_NAME}."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              break
            fi
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the change to ${GITHUB_REF_NAME}."
            exit 1
          fi
          {
            echo "### ${HEADLINE}"
            echo "- **Run:** \`${KIND}\`"
            echo "- **Model:** \`${MODEL}\`"
            echo "- **Change:** \`${SUMMARY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
