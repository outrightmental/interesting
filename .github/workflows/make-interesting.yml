name: Make the website more interesting

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:
    inputs:
      model:
        description: "GitHub Copilot model ID to use (leave blank to pick a flagship model at random)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: make-interesting
  cancel-in-progress: false

env:
  COPILOT_CLI_VERSION: "1.0.91" # pinned: the silo relies on this version's flags and output format

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit changes to /site
      copilot-requests: write # call GitHub Copilot with the workflow's own token
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # The platform package is the CLI binary itself: an exact version with no dependencies and no
      # install scripts, so nothing unpinned ever runs next to the token. It is installed before
      # checkout, away from the repository's credentials.
      - name: Install GitHub Copilot CLI
        run: |
          npm install --global --ignore-scripts "@github/copilot-linux-x64@${COPILOT_CLI_VERSION}"
          copilot-linux-x64 --version

      - name: Checkout
        uses: actions/checkout@v5

      - name: Ask a random AI model to make the website more interesting
        id: ai
        env:
          # A fine-grained PAT with the "Copilot Requests" permission, if one is configured (billed
          # to that user's Copilot plan). Otherwise the workflow's own token, which Copilot accepts
          # once the organization allows Copilot CLI usage billed to the organization.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          COPILOT_BIN: copilot-linux-x64
          MODEL: ${{ inputs.model }}
          # Optional comma-separated list of model ids to pick from instead of the built-in list.
          # List flagship models only: ids recognised as small or mid-tier are refused, but an
          # unknown id that is only a version number cannot be judged and is used as listed.
          MODEL_POOL: ${{ vars.MODEL_POOL }}
        run: python3 .github/scripts/make_interesting.py

      - name: Ensure only /site was modified
        run: |
          outside="$(git status --porcelain --untracked-files=all -- . ':(exclude)site')"
          if [ -n "$outside" ]; then
            echo "::error::Changes outside /site are not allowed:"
            echo "$outside"
            exit 1
          fi
          test -f site/index.html || { echo "::error::site/index.html is missing"; exit 1; }
          test -f site/error.html || { echo "::error::site/error.html is missing"; exit 1; }

      - name: Commit and push
        id: commit
        env:
          MODEL: ${{ steps.ai.outputs.model }}
          SUMMARY: ${{ steps.ai.outputs.summary }}
        run: |
          git add -A -- site
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make the website more interesting: ${SUMMARY}" -m "Model: ${MODEL}"
          # The branch may have moved while the model was thinking: rebase the commit and try again.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "::notice::Push ${attempt} was rejected; rebasing onto the latest ${GITHUB_REF_NAME}."
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              break
            fi
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the change to ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Made the website more interesting"
            echo "- **Model:** \`${MODEL}\`"
            echo "- **Change:** \`${SUMMARY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: iterate
    if: needs.iterate.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
