name: Deploy site to GitHub Pages

# The pipeline for main: every commit that lands there is tested, and when the tests pass, /site is
# deployed to GitHub Pages. A failing test blocks the deploy.
on:
  push:
    branches: [main]
  # The AI's commit is pushed with GITHUB_TOKEN, and GitHub starts no workflow for such a push. So
  # the pipeline also starts when that workflow finishes, and picks up the commit it left on main.
  workflow_run:
    workflows: ["Make the website more interesting"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual fallback

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # After the AI workflow, only when it succeeded and left a new commit: for this event
    # github.sha is the tip of main, and head_sha is the commit that workflow started from.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != github.sha)
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test # a failed or skipped test job means no deploy
    # Only main is ever deployed; a manual run on another branch stops after the tests.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Serve error.html as the 404 page
        run: |
          cp site/error.html site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
