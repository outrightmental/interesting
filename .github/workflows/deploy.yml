name: Deploy site

# The pipeline for main: every commit that lands there is tested, and when the tests pass, /site is
# built and the result is published to S3 and the CloudFront cache is invalidated. A failing test
# blocks every deploy, and so does a failing build.
#
# https://makeitmoreinteresting.com/ is the site's only home — the bucket, the distribution and every
# secret this workflow reads, the GA4 measurement ID included, are all defined in /infra. (GitHub
# Pages used to publish /site in parallel; it is retired, and nothing here publishes to it.)
on:
  push:
    branches: [main]
  # The AI's commit is pushed with GITHUB_TOKEN, and GitHub starts no workflow for such a push. So
  # the pipeline also starts when that workflow finishes, and picks up the commit it left on main.
  workflow_run:
    workflows: ["Make the website more interesting"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual fallback

permissions: {}

# One pipeline run at a time, and the rest wait their turn. Without `queue: max` only one run can
# wait, and a newer run takes its place: a run with nothing to do (see the `if` below) could then
# push out the run that was waiting to deploy a commit.
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

jobs:
  test:
    # After the AI workflow, only when it succeeded and main has moved since it started: for this
    # event github.sha is the tip of main, and head_sha is the commit that workflow started from.
    # Normally the move is the AI's own commit. A push by someone else in the meantime counts too,
    # and is then tested and deployed once more, which is harmless.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != github.sha)
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  aws:
    name: Publish to S3 and CloudFront
    needs: test # a failed or skipped test job means no deploy
    # Only main is ever deployed; a manual run on another branch stops after the tests.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No credentials are written into the checkout: the AWS keys reach the two commands below as
      # environment variables and nothing else.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # /infra is applied by hand, so the bucket and its secrets may not exist yet. Until they do
      # this job says so and finishes green, rather than failing on every hourly commit; the first
      # push after `terraform apply` publishes for real with no further change here.
      - name: Check for the deploy secrets
        id: secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_S3_BUCKET AWS_CLOUDFRONT_DISTRIBUTION_ID; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing published: the AWS deploy secrets are not set yet."
            {
              echo "### Not published to S3 and CloudFront"
              echo "These repository secrets are not set yet:${missing}."
              echo ""
              echo "They are created by \`terraform apply\` in \`/infra\` (see \`infra/README.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # /site is source, not the artifact: the build renders its templates and compiles its Sass
      # into a folder, and that folder is what gets published. It is written under RUNNER_TEMP, so
      # nothing generated ever lands in the checkout. Both steps run before the AWS keys reach this
      # job, and --ignore-scripts keeps npm from running install hooks at all.
      - name: Set up Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build /site
        if: steps.secrets.outputs.ready == 'true'
        id: build
        run: |
          npm ci --ignore-scripts
          out="${RUNNER_TEMP}/site-build"
          npm run --silent build -- --out "$out" --quiet
          test -s "${out}/index.html" || { echo "::error::the build produced no index.html"; exit 1; }
          test -s "${out}/error.html" || { echo "::error::the build produced no error.html"; exit 1; }
          echo "dir=${out}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.secrets.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # The one thing the published copy of /site does not carry in the repository. site/js/analytics.js
      # ships a placeholder instead of the GA4 measurement ID, and the copy on its way to S3 gets
      # the real one here. That is what lets a fork, a local copy or any checkout this step has not
      # run over stay silent: the placeholder switches that file off, so no tag loads, no consent
      # banner appears and no cookie is set. GA_MEASUREMENT_ID comes from the same
      # `terraform apply` as the AWS secrets (infra/github.tf); until it is set, the site is
      # published without analytics rather than not published at all.
      #
      # The substitution is done on the built artifact, not on site/ in the checkout: the build runs
      # above and copies analytics.js through verbatim (placeholder and all), and it is that built
      # copy that the sync step publishes. Editing the source would leave the deployed file untouched.
      - name: Inject the Google Analytics measurement ID
        if: steps.secrets.outputs.ready == 'true'
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail
          placeholder='__GA_MEASUREMENT_ID__'
          analytics="${BUILD_DIR}/js/analytics.js"
          if ! grep -q "$placeholder" "$analytics"; then
            echo "::error::${analytics} has no ${placeholder} for the measurement ID to replace."
            exit 1
          fi
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "::notice::GA_MEASUREMENT_ID is not set, so the site is published without analytics."
            {
              echo "### Published without analytics"
              echo "The \`GA_MEASUREMENT_ID\` repository secret is not set, so \`site/js/analytics.js\`"
              echo "keeps its placeholder and loads neither the Google tag nor the consent banner."
              echo "It is created by \`terraform apply\` in \`/infra\` (see \`infra/README.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Checked, not trusted: the value is pasted into a file, and a GA4 measurement ID is only
          # ever "G-" followed by capitals and digits.
          if ! printf '%s' "$GA_MEASUREMENT_ID" | grep -Eq '^G-[A-Z0-9]+$'; then
            echo "::error::GA_MEASUREMENT_ID is not a GA4 measurement ID (expected G-XXXXXXX)."
            exit 1
          fi
          sed -i "s/${placeholder}/${GA_MEASUREMENT_ID}/g" "$analytics"
          if grep -q "$placeholder" "$analytics"; then
            echo "::error::the placeholder survived the substitution in ${analytics}."
            exit 1
          fi
          echo "Measurement ID injected into ${analytics}."

      # --delete keeps the bucket an exact mirror of the built site: a page the AI removed stops
      # being served. The built artifact is the whole of what is published, and nothing else is.
      - name: Sync /site to S3
        if: steps.secrets.outputs.ready == 'true'
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          BUILD_DIR: ${{ steps.build.outputs.dir }}
        run: aws s3 sync "${BUILD_DIR}/" "s3://${AWS_S3_BUCKET}" --delete

      - name: Invalidate the CloudFront cache
        if: steps.secrets.outputs.ready == 'true'
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

      - name: Summarise the deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          {
            echo "### Published to S3 and CloudFront"
            echo "<https://makeitmoreinteresting.com/>"
          } >> "$GITHUB_STEP_SUMMARY"
