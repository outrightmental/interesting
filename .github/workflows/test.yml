name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Workflow scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No model is called: the tests swap the Copilot CLI for a stand-in.
      - name: Run the tests for the workflow scripts
        run: python3 -m unittest discover -s .github/scripts -v
