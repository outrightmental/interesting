name: Test

# Runs on every pull request, and as the first stage of the main-branch pipeline in deploy.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its older test run. Runs on main never cancel each other.
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job, and deliberately so — though not for the reason the two were first merged. These
  # were two jobs, the workflow scripts and the infrastructure side by side, and on 2026-10-05 a
  # run lost the infrastructure half: it sat queued about ten minutes, was handed no runner at all,
  # and was cancelled with zero steps while its sibling passed in ninety seconds. Merging them was
  # meant to stop that by asking the pool for one runner instead of two. It did not. The very next
  # run — one job, one runner — sat queued ten minutes and fifteen seconds and was cancelled the
  # same way, with an empty runner name and no steps; its re-run lasted fifteen minutes and went
  # the same way again; and so did a single-job Test on an unrelated branch, twice, and a scheduled
  # run on main. GitHub had an incident open for precisely this, delays assigning hosted runners
  # across runner configurations. So the starvation was never about how many runners this workflow
  # asks for, there is no fixed queue limit to design around, and no value configurable here
  # avoids any of it: a run cancelled with no runner name and no steps wants re-running once the
  # pool recovers, not editing.
  #
  # What survives is the smaller, true claim. Both halves together finish inside two minutes, so
  # one job costs a few seconds of wall clock and asks the pool once rather than twice. Keep it
  # one job for that reason alone: the parallelism was worth less than it cost.
  test:
    name: Workflow scripts and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installed before the tests, not after, so the infrastructure checks at the end of the job
      # never fail for want of the tool rather than for a fault in /infra.
      - name: Install Terraform
        id: terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The tests build /site: the reachability axiom is about the built site, and a pull request
      # should also find out that the site still builds. --ignore-scripts because nothing in the
      # build needs an install script, so none should run.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the build toolchain
        run: npm ci --ignore-scripts

      # No model is called: the tests swap the Copilot CLI for a stand-in. The tests that build the
      # site fail here instead of skipping if the toolchain is missing, because the runner sets CI.
      - name: Run the tests for the workflow scripts
        run: python3 -m unittest discover -s .github/scripts -v

      # Every check below reports whatever the ones above it did — `!cancelled()` rather than the
      # default, which would stop the job at the first failure. These checks are independent of the
      # tests and of each other, and were a separate job until they shared this one; a pull request
      # should still learn everything that is wrong with it from a single run.
      - name: Check formatting
        if: ${{ !cancelled() && steps.terraform.outcome == 'success' }}
        run: terraform -chdir=infra fmt -check -recursive -diff

      # Only the configuration is checked: this reads no state and touches no cloud account, so it
      # needs no credentials. Nothing in this repository ever runs `terraform plan` or `apply` —
      # /infra is applied by hand (see infra/README.md).
      - name: Validate the configuration
        if: ${{ !cancelled() && steps.terraform.outcome == 'success' }}
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
